server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ai-hospital
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_hospital?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis:
  type-aliases-package: com.expert.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

# JWT - 生产环境必须通过环境变量 JWT_SECRET 配置强密钥
jwt:
  secret: ${JWT_SECRET:ai-hospital-secret-key-please-change-in-production-2024}
  expiration: 86400000  # 24 hours

# CORS - 生产环境必须通过环境变量 CORS_ALLOWED_ORIGINS 配置具体域名
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging
logging:
  level:
    com.expert: DEBUG
    com.expert.mapper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
